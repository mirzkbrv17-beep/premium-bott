services:
  - type: web
    name: abu-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase: { name: abu-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: MANUAL_CARD_INFO
        sync: false
databases:
  - name: abu-db
    plan: free
